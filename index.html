<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-wrapper">
  <h1 class="title">SNAKE</h1>

  <div class="scoreboard">
    <div class="score-box">
      <span class="label">Score</span>
      <span id="score" class="value">0</span>
    </div>
    <div class="score-box">
      <span class="label">High Score</span>
      <span id="high-score" class="value">0</span>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="game" width="400" height="400"></canvas>

    <div id="overlay" class="overlay">
      <div class="overlay-content">
        <h2 id="overlay-title">Snake</h2>
        <p id="overlay-message">Press an arrow key or WASD to start</p>
        <button id="restart-btn" class="restart-btn hidden">Restart</button>
      </div>
    </div>
  </div>

  <p class="hint">Use Arrow Keys or WASD to move</p>
</div>

<script src="script.js"></script>
</body>
</html>
